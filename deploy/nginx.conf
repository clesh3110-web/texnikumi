server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN YOUR_WWW_DOMAIN;

    client_max_body_size 50M;

    location /static/ {
        alias /var/www/guliston_texnikum/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Tibbiy hujjatlar faqat Django ruxsat tekshiruvidan keyin X-Accel-Redirect orqali beriladi.
    location /media/attendance_documents/ {
        internal;
        alias /var/www/guliston_texnikum/media/attendance_documents/;
    }

    location /media/ {
        alias /var/www/guliston_texnikum/media/;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/guliston/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
